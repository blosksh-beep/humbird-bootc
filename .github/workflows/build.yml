name: Build bootc image

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.github/workflows/**'
      - 'VERSION'
      - 'mok/**'
  pull_request:
    branches: [main]
  schedule:
    # 每周日 UTC 02:00 自动重建（捡上游基础镜像更新）
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up podman/buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah skopeo
          podman --version

      - name: Read version
        id: version
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "version: v$VER"

      - name: Write MOK signing keys (not baked into image)
        # Containerfile 第 7 段用 RUN --mount=type=secret 读取私钥对
        # vboxdrv 等内核模块签名 (Secure Boot)。secret 只在该 RUN 层可见,
        # 不会进入镜像层。公钥在仓库 mok/ 下, 随镜像烘焙供 mokutil --import。
        env:
          MOK_PRIV_B64: ${{ secrets.MOK_PRIVATE_KEY_B64 }}
        run: |
          if [ -n "$MOK_PRIV_B64" ]; then
            echo "$MOK_PRIV_B64" | base64 -d > /tmp/mok_priv.pem
            chmod 600 /tmp/mok_priv.pem
            ls -la /tmp/mok_priv.pem
          else
            echo "::warning::MOK_PRIVATE_KEY_B64 secret 未设置, 跳过签名(构建将因无 secret 失败除非 Containerfile 容忍)"
          fi

      - name: Build bootc image
        run: |
          # 标签: latest + 版本号 vN (版本递增管理)
          SECRET_ARGS=""
          if [ -f /tmp/mok_priv.pem ]; then
            SECRET_ARGS="--secret id=mok_priv,src=/tmp/mok_priv.pem"
          fi
          buildah bud --format docker \
            --build-arg CLASH_VERGE_VERSION=2.5.2 \
            $SECRET_ARGS \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:v$VER" \
            .

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u "${{ github.actor }}" --password-stdin
          buildah push --format docker "$IMAGE_NAME:latest"
          buildah push --format docker "$IMAGE_NAME:v$VER"

      - name: Bump version for next build
        if: github.event_name != 'pull_request'
        run: |
          # 小版本递增: v4.01 -> v4.02 (awk 浮点 + %.2f 保证两位小数)
          NEXT=$(awk -v v="$VER" 'BEGIN { printf "%.2f", v + 0.01 }')
          echo "$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to v$NEXT"
          git push

      - name: Prune non-versioned tags (keep vN versions only)
        if: github.event_name != 'pull_request'
        run: |
          # 删除所有不带 vN 标签的版本（时间戳旧版），只保留 v1/v2/v3/v4.01... 和 latest
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions?per_page=50" \
            | jq -r '.[] | select(.metadata.container.tags != null and .metadata.container.tags != []) | select([.metadata.container.tags[] | test("^v[0-9.]+$")] | all(. == false)) | .id' \
            | while read -r ID; do
              echo "Deleting old timestamp-tagged version ID: $ID"
              curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions/$ID"
            done
