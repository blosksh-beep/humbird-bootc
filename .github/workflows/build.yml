name: Build bootc image

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  schedule:
    # 每周日 UTC 02:00 自动重建（捡上游基础镜像更新）
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up podman/buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah skopeo
          podman --version

      - name: Build bootc image
        run: |
          # 固定时间戳标签（build 和 push 用同一个值）
          TAG="$(date +%Y%m%d%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          buildah bud --format docker \
            --build-arg CLASH_VERGE_VERSION=2.5.2 \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$TAG" \
            .

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u "${{ github.actor }}" --password-stdin
          buildah push --format docker "$IMAGE_NAME:latest"
          buildah push --format docker "$IMAGE_NAME:$TAG"
