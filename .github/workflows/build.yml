name: Build bootc image

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.github/workflows/**'
      - 'VERSION'
  pull_request:
    branches: [main]
  schedule:
    # 每周日 UTC 02:00 自动重建（捡上游基础镜像更新）
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up podman/buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah skopeo
          podman --version

      - name: Read version
        id: version
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "version: v$VER"

      - name: Build bootc image
        run: |
          # 标签: latest + 版本号 vN (版本递增管理)
          buildah bud --format docker \
            --build-arg CLASH_VERGE_VERSION=2.5.2 \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:v$VER" \
            .

      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u "${{ github.actor }}" --password-stdin
          buildah push --format docker "$IMAGE_NAME:latest"
          buildah push --format docker "$IMAGE_NAME:v$VER"

      - name: Bump version for next build
        if: github.event_name != 'pull_request'
        run: |
          NEXT=$((VER + 1))
          echo "$NEXT" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to v$NEXT"
          git push
